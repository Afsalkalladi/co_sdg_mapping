<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CO–SDG Mapping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1f2328;--muted:#6b7280;--line:#e5e5e0;--soft:#f1f1ee;--accent:#1f5f93;
  --l1:#d7e6f2;--l2:#7fb0d6;--l3:#1f5f93}
@media (prefers-color-scheme:dark){:root{--bg:#15181b;--panel:#1d2125;--ink:#e8eaed;--muted:#9aa3ad;--line:#2e3439;--soft:#262b30;--accent:#8cc0e8;
  --l1:#22394c;--l2:#3b6f99;--l3:#8cc0e8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}
header{display:flex;align-items:center;gap:20px;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:700}
header .sub{color:var(--muted);font-size:13px}
nav{margin-left:auto;display:flex;gap:4px}
nav button{border:0;background:none;padding:7px 14px;border-radius:8px;cursor:pointer;font:inherit;font-weight:500;color:var(--muted)}
nav button.on{background:var(--soft);color:var(--ink)}
.layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 62px)}
aside{background:var(--panel);border-right:1px solid var(--line);padding:16px;position:sticky;top:62px;height:calc(100vh - 62px);display:flex;flex-direction:column;gap:10px}
aside input{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:inherit;color:inherit}
ul{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
li{padding:8px 10px;border-radius:8px;cursor:pointer}
li:hover{background:var(--soft)}
li.on{background:var(--soft);font-weight:600}
li small{display:block;color:var(--muted);font-size:12px;font-weight:400}
main{padding:28px 32px 60px;min-width:0;max-width:1200px}
h2{font-size:24px;margin:0 0 4px}
.meta{color:var(--muted);font-size:14px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:3px 10px 3px 3px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px}
.num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;font-weight:600;font-size:12px;flex:none}
.chip .num{border-radius:999px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px}
.card h3{margin:0 0 14px;font-size:16px}
.wrap{overflow-x:auto}
table.map{width:100%;border-collapse:collapse;font-size:14px}
.map th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px;border-bottom:2px solid var(--line)}
.map td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.map td.co{font-weight:600;white-space:nowrap}
.map td.cot{width:36%}
.map td.s{white-space:nowrap}
.map td.s>span{display:inline-flex;align-items:center;gap:8px}
.map td.l{text-align:center}
.lv{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;font-weight:600}
.lv1{background:var(--l1)}.lv2{background:var(--l2);color:#fff}.lv3{background:var(--l3);color:#fff}
@media (prefers-color-scheme:dark){.lv3{color:#0e1215}}
.map td.none{color:var(--muted)}
table.grid{border-collapse:separate;border-spacing:3px;font-size:13px;width:100%;min-width:720px}
.grid th{font-weight:600;color:var(--muted)}
.grid thead th span{display:grid;place-items:center;height:28px;border-radius:5px;cursor:help}
.grid th.r{text-align:left;padding-right:8px;white-space:nowrap;color:var(--ink)}
.grid td{height:30px;text-align:center;border-radius:5px;background:var(--soft);font-weight:600}
.grid td.v1{background:var(--l1)}.grid td.v2{background:var(--l2);color:#fff}.grid td.v3{background:var(--l3);color:#fff}
@media (prefers-color-scheme:dark){.grid td.v3{color:#0e1215}}
.grid td.name{background:none;text-align:left;font-weight:500;white-space:nowrap;max-width:300px;overflow:hidden;text-overflow:ellipsis;cursor:pointer;padding-right:8px}
.grid td.name:hover{color:var(--accent);text-decoration:underline}
.key{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.key i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.stats{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat{flex:1;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.stat b{display:block;font-size:28px}
.stat span{color:var(--muted);font-size:13px}
.bars{display:flex;flex-direction:column;gap:8px;font-size:13px}
.bar{display:grid;grid-template-columns:290px 1fr 140px;grid-template-areas:"lb t n";gap:12px;align-items:center}
.bar .lb{grid-area:lb;display:flex;align-items:center;gap:8px;min-width:0}
.bar .t{grid-area:t;background:var(--soft);height:14px;border-radius:4px;overflow:hidden}
.bar .f{height:100%;border-radius:4px}
.bar .n{grid-area:n;color:var(--muted);text-align:right;white-space:nowrap}
/* sticky first column so row labels stay visible while scrolling the grid sideways */
.grid tr>:first-child{position:sticky;left:0;background:var(--panel);z-index:1}
/* phone-only pieces */
.picker,.cards{display:none}
.cards .co-card{border-top:1px solid var(--line);padding:14px 0}
.cards .co-card:first-child{border-top:0;padding-top:0}
.cards .co-h{font-weight:600;margin-bottom:2px}
.cards .co-t{margin:0 0 10px}
.cards .m{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:10px;padding:10px;margin-top:8px}
.cards .m .body{flex:1;min-width:0}
.cards .m .top{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:600;font-size:14px}
.cards .m p{margin:4px 0 0;color:var(--muted);font-size:13px}
.cards .none{color:var(--muted);font-size:14px}
@media (max-width:820px){
  header{padding:12px 14px;gap:10px;flex-wrap:nowrap;position:static}
  header .sub{font-size:12px}
  header h1{font-size:17px}
  nav{margin-left:auto}
  nav button{padding:6px 12px}
  .layout{display:block}
  aside{display:none}
  .picker{display:block;position:sticky;top:0;z-index:4;background:var(--bg);padding:10px 14px;border-bottom:1px solid var(--line)}
  .picker select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:inherit;font:inherit;font-weight:500}
  main{padding:18px 14px 48px}
  h2{font-size:21px;line-height:1.25}
  .card{padding:16px 14px;border-radius:12px}
  .map-table{display:none}
  .cards{display:block}
  .stat{min-width:0;flex:1 1 0;padding:12px}
  .stat span{font-size:12px}
  .stat b{font-size:22px}
  .bar{grid-template-columns:1fr auto;grid-template-areas:"lb n" "t t";gap:4px 8px}
  .bar .lb span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  table.grid{min-width:0;width:auto;border-spacing:2px;font-size:12px}
  .grid thead th span{height:24px;min-width:24px}
  .grid td{height:26px;min-width:24px}
  .grid td.name{max-width:120px;font-size:12px}
  .key{gap:10px}
}
</style>
</head>

ers.","m":{"9":2},"j":{"9":"The CO requires Gram–Schmidt mathematics in digital-receiver development. This provides clear partial curricular support for industry, innovation, and infrastructure."}},{"id":"CO5","t":"Apply digital modulation techniques for reliable signal transmission in communication systems.","m":{"9":1},"j":{"9":"The CO requires digital modulation for reliable transmission. This provides limited supporting curricular support for industry, innovation, and infrastructure."}}]},{"code":"102001/EC500E","name":"VLSI Design","group":"102001","cos":[{"id":"CO1","t":"Apply VLSI design methodologies to analyse and differentiate ASIC, SoC, PLD, and FPGA architectures.","m":{"9":1},"j":{"9":"The CO requires comparison of ASIC, SoC, PLD and FPGA design architectures. This provides limited supporting curricular support for industry, innovation, and infrastructure."}},{"id":"CO2","t":"Design basic CMOS logic gates using layout rules and different logic styles.","m":{"9":2},"j":{"9":"The CO requires CMOS-gate design with layout rules and logic styles. This provides clear partial curricular support for industry, innovation, and infrastructure."}},{"id":"CO3","t":"Analyse dynamic logic circuits and different memory cell architectures.","m":{"9":1},"j":{"9":"The CO requires dynamic-logic and memory-cell analysis. This provides limited supporting curricular support for industry, innovation, and infrastructure."}},{"id":"CO4","t":"Implement efficient arithmetic circuits like adders and multipliers.","m":{"9":2},"j":{"9":"The CO requires implementation of arithmetic circuits. This provides clear partial curricular support for industry, innovation, and infrastructure."}},{"id":"CO5","t":"Apply semiconductor fabrication concepts to explain and relate MOSFET fabrication processes and techniques.","m":{"9":1},"j":{"9":"The CO requires MOSFET fabrication concepts and processes. This provides limited supporting curricular support for industry, innovation, and infrastructure. ":"Apply the principles of S-parameters to model and analyze the performance characteristics of various microwave hybrid circuits, and apply device concepts to evaluate the operation of microwave semiconductor devices.","m":{"9":1},"j":{"9":"The CO requires S-parameter modelling of hybrid circuits and device operation. This provides limited supporting curricular support for industry, innovation, and infrastructure."}},{"id":"CO3","t":"Apply fundamental antenna theory to model the far-field patterns of dipole antennas and simulate radiation characteristics using computational electromagnetic tools.","m":{"9":2},"j":{"9":"The CO requires antenna far-field modelling and electromagnetic simulation. This provides clear partial curricular support for industry, innovation, and infrastructure."}},{"id":"CO4","t":"Design various broadband antennas, and analyze their radiation characteristics for wideband communication applications.","m":{"9":2},"j":{"9":"The CO requires broadband-antenna design and radiation analysis. This provides clear partial curricular support for industry, innovation, and infrastructure."}},{"id":"CO5","t":"Apply antenna array design techniques to develop various antenna array configurations, and analyze their radiation characteristics.","m":{"9":2},"j":{"9":"The CO requires antenna-array configuration design and radiation analysis. This provides clear partial curricular support for industry, innovation, and infrastructure."}},{"id":"CO6","t":"Familiarization of modern antennas and study of antenna simulation tools and antenna design.","m":{"9":2},"j":{"9":"The CO requires modern antennas and antenna-design simulation tools. This provides clear partial curricular support for industry, innovation, and infrastructure."}}]},{"code":"102001/EC600B","name":"Control Systems","group":"102001","cos":[{"id":"CO1","t":"Apply mathematical modelling to determine the transfer function of electromechanical systems.","m":{"9":1},"j":{"9":"The CO requires transfer-func n techniques and diversity schemes to design and analyze wireless communication systems.","m":{"9":2},"j":{"9":"The CO requires multicarrier and diversity system design. This provides clear partial curricular support for industry, innovation, and infrastructure."}},{"id":"CO4","t":"Analyze optical fiber characteristics and apply relevant principles to evaluate transmission performance and losses in fiber communication systems.","m":{"9":1},"j":{"9":"The CO requires optical-fibre transmission characteristics and losses. This provides limited supporting curricular support for industry, innovation, and infrastructure."}},{"id":"CO5","t":"Analyze the operation of optical sources, detectors, and amplifiers, and apply them to evaluate the performance of optical communication systems.","m":{"9":1},"j":{"9":"The CO requires operation and performance of optical devices. This provides limited supporting curricular support for industry, innovation, and infrastructure."}}]},{"code":"102001/EC603E","name":"Satellite Communication","group":"102001","cos":[{"id":"CO1","t":"Apply the fundamental principles of satellite communication to explain system operation and characteristics of different satellite orbits.","m":{"9":1},"j":{"9":"The CO requires satellite-system principles and orbit characteristics. This provides limited supporting curricular support for industry, innovation, and infrastructure."}},{"id":"CO2","t":"Apply the principles of satellite subsystems to explain their functions and their role in the overall performance of a satellite communication system.","m":{"9":1},"j":{"9":"The CO requires satellite-subsystem functions and system performance. This provides limited supporting curricular support for industry, innovation, and infrastructure."}},{"id":"CO3","t":"Apply link budget calculations to evaluate satellite communication links and analyze the design parameters of uplink and downlink systems.","m":{"9":2},"j":{"9":"The CO requires link budgets and uplink/downlink d requires federal relations, local governance and emergency provisions. This provides strong direct curricular support for peace, justice, and strong institutions."}}]}].sort((a,b)=>a.code.localeCompare(b.code));
const N=Array.from({length:17},(_,i)=>i+1);
const $=s=>document.querySelector(s);
let view="subject",current=SUBJECTS[0].code;

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fg=h=>{const n=parseInt(h.slice(1),16);return ((n>>16)*299+(n>>8&255)*587+(n&255)*114)/1000>170?"#1f2328":"#fff";};
const badge=n=>`<span class="num" style="background:${SDG[n][1]};color:${fg(SDG[n][1])}" title="SDG ${n}: ${esc(SDG[n][0])}">${n}</span>`;
const maxOf=s=>{const m={};s.cos.forEach(c=>{for(const k in c.m)m[k]=Math.max(m[k]||0,c.m[k]);});return m;};
const gridHead=`<thead><tr><th></th>${N.map(n=>`<th><span style="background:${SDG[n][1]};color:${fg(SDG[n][1])}" title="SDG ${n}: ${esc(SDG[n][0])}">${n}</span></th>`).join("")}</tr></thead>`;
const key=`<div class="key"><span><i style="background:var(--l3)"></i>3 High</span><span><i style="background:var(--l2)"></i>2 Medium</span><span><i style="background:var(--l1)"></i>1 Low</span></div>`;

$("#sub").textContent=`${SUBJECTS.length} subjects · ${SUBJECTS.reduce((a,s)=>a+s.cos.length,0)} course outcomes`;

function list(){
  const q=$("#q").value.trim().toLowerCase();
  const subs=SUBJECTS.filter(s=>!q||(s.code+" "+s.name).toLowerCase().includes(q));
  $("#list").innerHTML=subs.map(s=>`<li data-c="${esc(s.code)}" class="${view==="subject"&&s.code===current?"on":""}">${esc(s.name)}<small>${esc(s.code)}</small></li>`).join("")||`<li style="color:var(--muted)">No match</li>`;
}

function subject(){
  const s=SUBJECTS.find(x=>x.code===current),mx=maxOf(s);
  const rows=s.cos.map(c=>{
    const ks=Object.keys(c.m).sort((a,b)=>a-b),n=Math.max(ks.length,1);
    const lead=`<td class="co" rowspan="${n}">${esc(c.id)}</td><td class="cot" rowspan="${n}">${esc(c.t)}</td>`;
    if(!ks.length)return `<tr>${lead}<td class="none" colspan="3">No SDG mapped</td></tr>`;
    return ks.map((k,i)=>`<tr>${i?"":lead}<td class="s"><span>${badge(k)}SDG ${k}</span></td><td class="l"><span class="lv lv${c.m[k]}" title="${LEVEL[c.m[k]]}">${c.m[k]}</span></td><td>${esc(c.j[k]||"")}</td></tr>`).join("");
  }).join("");
  const grid=s.cos.map(c=>`<tr><th class="r" title="${esc(c.t)}">${esc(c.id)}</th>${N.map(n=>{const v=c.m[n]||0;return `<td class="v${v}" title="${esc(c.id)} – SDG ${n}: ${LEVEL[v]||"none"}">${v||""}</td>`;}).join("")}</tr>`).join("");
  $("#main").innerHTML=`<h2>${esc(s.name)}</h2><div class="meta">${esc(s.code)} · ${s.cos.length} course outcomes</div>
  <div class="chips">${Object.keys(mx).sort((a,b)=>mx[b]-mx[a]||a-b).map(n=>`<span class="chip">${badge(n)}${esc(SDG[n][0])}</span>`).join("")}</div>
  <div class="card"><h3>CO–SDG mapping</h3>
  <div class="cards">${s.cos.map(c=>{const ks=Object.keys(c.m).sort((a,b)=>a-b);
    return `<div class="co-card"><div class="co-h">${esc(c.id)}</div><p class="co-t">${esc(c.t)}</p>${ks.length?ks.map(k=>`<div class="m">${badge(k)}<div class="body"><div class="top"><span>SDG ${k} · ${esc(SDG[k][0])}</span><span class="lv lv${c.m[k]}" title="${LEVEL[c.m[k]]}">${c.m[k]}</span></div><p>${esc(c.j[k]||"")}</p></div></div>`).join(""):`<div class="none">No SDG mapped</div>`}</div>`;}).join("")}</div>
  <div class="wrap map-table"><table class="map"><thead><tr><th>CO</th><th>Course outcome</th><th>SDG</th><th style="text-align:center">Level</th><th>Justification</th></tr></thead><tbody>${rows}</tbody></table></div></div>
  <div class="card"><h3>Mapping matrix</h3><div class="wrap"><table class="grid">${gridHead}<tbody>${grid}</tbody></table></div>${key}</div>`;
}

function summary(){
  const cnt=Array(18).fill(0),co=Array(18).fill(0);
  SUBJECTS.forEach(s=>{const m=maxOf(s);for(const k in m)cnt[k]++;s.cos.forEach(c=>{for(const k in c.m)co[k]++;});});
  const top=Math.max(...cnt.slice(1)),covered=N.filter(n=>cnt[n]).length;
  $("#main").innerHTML=`<h2>Summary</h2><div class="meta">SDG coverage across all subjects</div>
  <div class="stats"><div class="stat"><b>${SUBJECTS.length}</b><span>Subjects</span></div><div class="stat"><b>${SUBJECTS.reduce((a,s)=>a+s.cos.length,0)}</b><span>Course outcomes</span></div><div class="stat"><b>${covered} / 17</b><span>SDGs covered</span></div></div>
  <div class="card"><h3>Subjects per SDG</h3><div class="bars">${N.map(n=>`<div class="bar"><div class="lb">${badge(n)}<span>${esc(SDG[n][0])}</span></div><div class="t"><div class="f" style="width:${cnt[n]/top*100}%;background:${SDG[n][1]}"></div></div><div class="n">${cnt[n]} subj · ${co[n]} COs</div></div>`).join("")}</div></div>
  <div class="card"><h3>Subject × SDG</h3><div class="wrap"><table class="grid">${gridHead}<tbody>${SUBJECTS.map(s=>{const m=maxOf(s);return `<tr><td class="name" data-c="${esc(s.code)}" title="${esc(s.code)}">${esc(s.name)}</td>${N.map(n=>`<td class="v${m[n]||0}">${m[n]||""}</td>`).join("")}</tr>`;}).join("")}</tbody></table></div>${key}</div>`;
}

function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  list();(view==="subject"?subject:summary)();
  $("#pick").innerHTML=(view==="summary"?`<option value="">Open a subject…</option>`:"")+SUBJECTS.map(s=>`<option value="${esc(s.code)}"${view==="subject"&&s.code===current?" selected":""}>${esc(s.name)} (${esc(s.code)})</option>`).join("");
}
$("#pick").onchange=e=>{if(e.target.value)open(e.target.value);};
const open=c=>{current=c;view="subject";render();scrollTo(0,0);};
document.querySelector("nav").onclick=e=>{const b=e.target.closest("button");if(b){view=b.dataset.v;render();}};
$("#list").onclick=e=>{const li=e.target.closest("[data-c]");if(li)open(li.dataset.c);};
$("#main").onclick=e=>{const t=e.target.closest("[data-c]");if(t)open(t.dataset.c);};
$("#q").oninput=list;
render();
</script>
</body>
</html>
